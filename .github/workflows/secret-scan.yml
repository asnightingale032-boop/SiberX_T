name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC — full-history scan only
  workflow_dispatch: {}

jobs:
  gitleaks:
    name: Scan for exposed secrets / API keys
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    # Fail closed (Security Recommendation, Dimension 7): if the scanner
    # step itself errors out (bad config, action failure, etc.) that must
    # fail the job, not be silently treated as "no leaks found." This is
    # the default GitHub Actions behavior (a step's non-zero exit fails
    # the job) — continue-on-error is left explicitly false, never true,
    # for these steps so a future edit can't accidentally soften that.
    steps:
      - name: Checkout
        # Pinned to a commit SHA, not a mutable tag (Security
        # Recommendation, Dimension 7 & 11: supply-chain integrity for
        # the scanner's own dependencies). Verified against
        # https://github.com/actions/checkout/releases — tag v6.0.3.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
        continue-on-error: false

      - name: Run gitleaks
        # Verified against https://github.com/gitleaks/gitleaks-action/releases
        # — tag v3.0.0 (also resolves the Node 20 -> Node 24 runtime
        # deprecation warning GitHub Actions raised against the old v2 pin).
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  full-history-scan:
    name: Full git history scan (scheduled + on-demand)
    # Security Recommendation, Dimension 7: "Scan full git history once
    # (gitleaks detect over all commits), not just each push diff, to
    # confirm nothing sensitive ever landed on an earlier commit or
    # branch." The job above scans each push's diff; this job
    # independently walks the entire history on a schedule (and on
    # demand via workflow_dispatch), which is a meaningfully different
    # check — a secret that was committed and later removed still shows
    # up here.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
        continue-on-error: false

      - name: Run gitleaks over full history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
        continue-on-error: false
