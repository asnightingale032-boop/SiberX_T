name: Static Security Checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend-hygiene:
    name: Front-end vulnerability patterns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a commit SHA, not a mutable tag. Verified against
        # https://github.com/actions/checkout/releases — tag v6.0.3.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify Node.js JS syntax
        run: |
          for f in $(find assets/js api -name "*.js"); do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Block dangerous JS patterns (eval, document.write, inline handlers)
        run: |
          set -e
          echo "Scanning for eval(), Function(), document.write(..."
          if grep -RInE "eval\(|new Function\(|document\.write\(" --include="*.js" --include="*.html" .; then
            echo "::error::Found a dangerous JS pattern (eval / Function constructor / document.write)."
            exit 1
          fi
          echo "Scanning HTML for inline event-handler attributes (onclick=, onerror=, etc.)..."
          if grep -RInE '\son[a-z]+\s*=\s*"' --include="*.html" .; then
            echo "::error::Found an inline event-handler attribute — this breaks the strict script-src CSP and is a front-end risk. Use addEventListener instead."
            exit 1
          fi
          echo "No dangerous patterns found."

      - name: Block inline style="" attributes (Dimension 11 — keeps style-src free of 'unsafe-inline')
        run: |
          set -e
          if grep -RInE 'style="' --include="*.html" .; then
            echo "::error::Found an inline style=\"\" attribute. vercel.json's CSP no longer allows 'unsafe-inline' for style-src — use a CSS class in assets/css/style.css instead, or element.style.setProperty()/element.style.<prop>= from JS (CSSOM assignment, not a markup attribute, is not restricted by style-src)."
            exit 1
          fi
          if grep -RPn '\.innerHTML\s*=\s*`[^`]*style="' --include="*.js" assets/js/ 2>/dev/null; then
            echo "::error::Found a JS-built style=\"\" attribute inside an innerHTML template. Same rule as above applies to generated markup."
            exit 1
          fi
          echo "No inline style attributes found."

      - name: Block un-escaped interpolation into innerHTML (Dimension 1 — structural escaping)
        run: |
          set -e
          # Every .innerHTML assignment in this codebase must go through
          # the html`` auto-escaping tagged template (or be a fully
          # static string with no ${...} interpolation at all) — see
          # assets/js/app.js. A bare template literal assigned directly
          # to .innerHTML that still contains an interpolation is exactly
          # the pattern that lets a call site forget to escape.
          if grep -RPn '\.innerHTML\s*=\s*`[^`]*\$\{' --include="*.js" assets/js/ 2>/dev/null; then
            echo "::error::Found .innerHTML = \`...\${...}\` — an un-tagged template literal with an interpolation assigned directly to innerHTML. Wrap it with the html\`\` helper from assets/js/app.js (or build the fragment with safe() if it's pre-escaped) instead of assigning a bare template string."
            exit 1
          fi
          echo "No un-escaped innerHTML interpolations found."

      - name: Block obvious hardcoded secrets (belt-and-suspenders alongside gitleaks)
        run: |
          set -e
          # security-review.js intentionally contains fictional, fake
          # secrets as training content for the Security Review Lab —
          # excluded here the same way it's excluded in .gitleaks.toml.
          if grep -RInE "(api[_-]?key|secret[_-]?key|access[_-]?token)\s*[:=]\s*['\"][A-Za-z0-9_\-]{16,}['\"]" \
             --include="*.js" --include="*.html" --include="*.json" \
             --exclude-dir=".github" \
             --exclude="security-review.js" .; then
            echo "::error::Found what looks like a hardcoded secret. Remove it and rotate the credential immediately if real."
            exit 1
          fi
          echo "No obvious hardcoded secrets found."
